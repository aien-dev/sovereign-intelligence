name: Alpha tester report
description: Report an install, chat, uninstall or rollback result from the Sovereign Intelligence alpha on a DGX Spark.
title: "[alpha-tester] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing. Read [docs/tester/README.md](https://github.com/aien-dev/sovereign-intelligence/blob/main/docs/tester/README.md) first; it lists the known issues.

        **Never paste chat content, prompts, model replies, API keys, Hugging Face tokens or any other token or secret in this issue.** Everything here is public. Read every file and log line before you attach it, and leave out any line that contains one of those.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no chat content, prompts, model replies, keys or tokens.
          required: true
  - type: dropdown
    id: release
    attributes:
      label: Release
      description: The tag you cloned and ran installer/install.sh from (`aienos about` prints it).
      options:
        - alpha-20261026.2
        - other (say which below)
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: What were you doing?
      options:
        - install.sh (platform check, download, signature check)
        - wizard (doctor, plan, install, model download)
        - first chat / aienos chat
        - aienos start / stop
        - aienos verify
        - aienos uninstall
        - aienos rollback
        - aienos doctor --report
        - other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected and what you saw. Quote the installer's or wizard's own messages and the exit status (`echo $?`). Do not quote chat text.
      placeholder: |
        Ran: sh installer/install.sh
        Expected: ...
        Saw: ...
        Exit status: ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor archive or doctor output
      description: |
        If your release has `aienos doctor --report` (draft PR #54; not in alpha-20261026.2), run it, read the archive with `tar -xzOf <file>`, and attach the `aienos-report-*.tar.gz` file here.
        Otherwise attach or paste the output of `aienos about`, `aienos doctor` and `aienos verify`.
      placeholder: Drag the aienos-report-*.tar.gz file here, or paste the three outputs.
    validations:
      required: true
  - type: input
    id: dgx-os
    attributes:
      label: DGX OS / Ubuntu version
      description: "`grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release` and, if present, `grep -E '^DGX_(PRETTY_NAME|SWBUILD_VERSION|OTA_VERSION)=' /etc/dgx-release`"
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: NVIDIA kernel driver version
      description: "`cat /sys/module/nvidia/version` (the alpha accepts 580.173.02 only)"
    validations:
      required: true
  - type: input
    id: kernel
    attributes:
      label: Linux kernel
      description: "`uname -srm`"
    validations:
      required: true
  - type: input
    id: memory
    attributes:
      label: Memory
      description: "`grep -E '^(MemTotal|MemAvailable):' /proc/meminfo`"
    validations:
      required: true
  - type: dropdown
    id: gpu-shared
    attributes:
      label: Was anything else using the GPU?
      description: Another model server or GPU program running during the test.
      options:
        - "no"
        - "yes"
        - don't know
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines (optional)
      description: |
        Only lines from ~/.local/share/aienos/download.log or engine.log that show the problem. Remove any line containing a prompt, a reply, a key, a token or an Authorization header. Never attach a whole log from a chat session.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else (optional)
      description: Network setup (proxy?), free disk in your home folder (`df -h ~`), anything unusual about the machine.
