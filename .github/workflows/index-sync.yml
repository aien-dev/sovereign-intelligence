# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# Keeps the project index current without anyone remembering to. Every hour, on demand, and when
# another repository sends a repository_dispatch of type index-sync, it reads the public aien-dev
# repositories from GitHub, rebuilds index/repos.json and the README index section with
# index/gen/index.om, and opens (or updates) one pull request from bot/index-sync labelled
# automerge. The pull request merges itself only after the required index-check passes; the
# ruleset is the same for this bot as for everyone else.
# A public repository with no entry in index/curated.yml makes the generator exit 1 and this run
# fail, listing the repository, so a new repository cannot go missing silently.
# Only the built-in GITHUB_TOKEN is used; no other secret.
name: index-sync
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [index-sync]
permissions:
  contents: read
concurrency:
  group: index-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: write       # push the bot/index-sync branch
      pull-requests: write  # open the pull request and enable auto-merge
      actions: write        # dispatch the index check on the bot branch
    env:
      OMEGA_REV: 3364a1dfd0ca50c1b82bf19ba34932d8bc10a7a9
      OMC_PIN: befb8199db8c4bca188a494dfaac2a6f0ee5c36fcea11188c75666c55fce8a1d
      GH_TOKEN: ${{ github.token }}
      BRANCH: bot/index-sync
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Pinned omega-mv
        run: |
          git clone --filter=blob:none https://github.com/aien-dev/omega-mv.git "$RUNNER_TEMP/omega"
          git -C "$RUNNER_TEMP/omega" checkout --quiet "$OMEGA_REV"
          echo "$OMC_PIN  $RUNNER_TEMP/omega/seed/out/omc" | sha256sum -c -
      - name: Compile the generator
        run: |
          set -eu
          "$RUNNER_TEMP/omega/seed/out/omc" < index/gen/index.om > "$RUNNER_TEMP/index" 2> "$RUNNER_TEMP/e1"
          test ! -s "$RUNNER_TEMP/e1"
          chmod +x "$RUNNER_TEMP/index"
      - name: Read the public repositories
        run: gh api graphql --paginate -F query=@index/gen/repos.graphql > "$RUNNER_TEMP/api.json"
      - name: Rebuild the index
        run: '"$RUNNER_TEMP/index" fetch "$RUNNER_TEMP/api.json"'
      - name: Open or update the pull request
        run: |
          set -eu
          if git diff --quiet; then
            echo "index unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -q -am "index: refresh from the public aien-dev repositories"
          git push -q --force origin "HEAD:refs/heads/$BRANCH"
          gh workflow run index.yml --ref "$BRANCH"
          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            # Needs the organization setting "Allow GitHub Actions to create and approve pull
            # requests". Without it the refreshed branch is pushed and a person opens the PR.
            if ! gh pr create --base main --head "$BRANCH" --label automerge \
              --title "index: refresh from the public aien-dev repositories" \
              --body "Generated by the index-sync workflow (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Only index/repos.json and the README index section change. It merges after index-check passes."; then
              compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
              echo "::warning::GitHub Actions may not open pull requests in this organization; open one from $BRANCH: $compare"
              echo "Index refreshed on \`$BRANCH\`. Open the pull request: $compare" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          fi
          gh pr merge "$pr" --auto --squash --delete-branch
