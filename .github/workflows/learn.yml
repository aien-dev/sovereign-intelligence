# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# Phase 1 of https://github.com/aien-dev/sovereign-intelligence/issues/31 retired the shell
# runners under docs/learn and docs/academy. This job refuses a new first-party runner in
# those trees. It does not clone omega-mv, it does not run omc, and it does not grade hardware.
name: learn
on:
  pull_request:
    paths:
      - "docs/learn/**"
      - "docs/academy/**"
      - ".github/workflows/learn.yml"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/learn/**"
      - "docs/academy/**"
      - ".github/workflows/learn.yml"
permissions:
  contents: read
jobs:
  learn-check:
    name: learn-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: No first-party runners under docs/learn or docs/academy
        run: |
          python3 - << 'PY'
          import os, sys
          roots = ("docs/learn", "docs/academy")
          bad = []
          for root in roots:
              for dirpath, dirs, files in os.walk(root):
                  dirs[:] = [d for d in dirs if d != ".git"]
                  for fn in files:
                      path = os.path.join(dirpath, fn)
                      ext = os.path.splitext(fn)[1]
                      if ext in (".sh", ".bash", ".py", ".js", ".mjs"):
                          bad.append(path + " ext")
                          continue
                      if ext == ".om":
                          continue
                      with open(path, "rb") as f:
                          head = f.read(4096)
                      include = b"#" + b"include"
                      fnmain = b"fn main" + b"("
                      if head.startswith(b"#!"):
                          bad.append(path + " shebang")
                      elif include in head:
                          bad.append(path + " include")
                      elif fnmain in head:
                          bad.append(path + " fnmain")
          if bad:
              print("LEARN-CHECK FAIL")
              print("\n".join(bad))
              sys.exit(1)
          print("LEARN-CHECK PASS runners=0")
          PY
