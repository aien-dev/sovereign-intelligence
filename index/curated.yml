# Hand-curated fields for the Sovereign Intelligence index.
# scripts/gen_index.py joins these with GitHub's data and fails (exit 1) when a
# public aien-dev repository has no entry here, or an entry is no longer public.
#
# Rule: when you change any aien-dev repository's purpose, status or links, or add
# a repository, update its entry here in the same piece of work.
#
# evidence: PROPOSED | IMPLEMENTED | EXERCISED | QUALIFIED | n/a (docs, mirrors)
# license: optional; overrides GitHub's detection when that is less precise.
# Values are plain words or double-quoted strings. Never name a private repository.

layers:
  - key: hardware
    title: "Silicon, firmware and boot"
    blurb: "The GB10 and NVIDIA's signed firmware are the boundary I do not own. Above it, the boot chain is mine."
  - key: driver
    title: "GPU kernel driver"
    blurb: "NVIDIA's open kernel module today; my own driver, aien-gpu, is being written inside CUDA++."
  - key: kernel
    title: "Kernel and operating system"
    blurb: "Aienux, the kernel, and AienOS, the operating system SI is built on."
  - key: runtime
    title: "CUDA++ runtime"
    blurb: "GPU programs with no NVIDIA user-space software."
  - key: omega
    title: "Omega language and compiler"
    blurb: "The language everything moves into: omc, irwasm, irspirv, and libraries written in it."
  - key: engine
    title: "The engine: Sovereign Core"
    blurb: "Inference, scheduling, evidence and the measurements behind every claim."
  - key: memory
    title: "Cortex memory"
    blurb: "Long-term memory that stays on your machine."
  - key: aien
    title: "Aien"
    blurb: "One persistent identity across my machines."
  - key: apps
    title: "Apps, tools and the front door"
    blurb: "What you touch: the installer, the site, and tools built on the stack."
  - key: design
    title: "Design, protocols and proof"
    blurb: "The specs, decisions and protocols the layers agree on."

