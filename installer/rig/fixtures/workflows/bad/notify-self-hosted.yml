# SYNTHETIC fixture for installer/rig/wfcheck.om (DRA-45). Never runs: it is not under .github/workflows.
name: good
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - installer/**
jobs:
  event-guard:
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ github.event_name }}" != pull_request
  rig:
    needs: event-guard
    runs-on: [self-hosted, linux, ARM64, si-test-spark]
    steps:
      - run: echo rig
  notify:
    needs: [event-guard, rig]
    if: failure()
    runs-on: [self-hosted, linux]
    permissions:
      issues: write
    steps:
      - run: gh issue create --title nightly --body "@maintainer failed"
